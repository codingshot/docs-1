name: Check Markdown links

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
  push:
    branches:
      - master

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: test-links.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-link-check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: 'website/mlc_config.json'
        folder-path: 'docs, website/near-api-js_versioned_docs, website/near-sdk-js_versioned_docs'
