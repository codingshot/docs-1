name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
  push:
    branches:
      - master

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: build-check.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '19'
      - name: Build docusaurus crowdin docs
        run: |
          cd website && yarn
          yarn crowdin:build
          yarn build
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
